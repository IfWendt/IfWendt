<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Leonardo Wendt - Dados, BI, Analytics e Front-end</title>
  <desc id="desc">Dashboard profissional em azul escuro com indicadores de carreira, evolução técnica e status de disponibilidade.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.58" stop-color="#0b1f38"/>
      <stop offset="1" stop-color="#102a49"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4bb8ff"/>
      <stop offset="1" stop-color="#1877f2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#1877f2" stop-opacity=".34"/>
      <stop offset="1" stop-color="#1877f2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#dff3ff" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="28" fill="url(#grid)"/>
  <ellipse cx="1000" cy="40" rx="360" ry="250" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="479" rx="27.5" fill="none" stroke="#4bb8ff" stroke-opacity=".2"/>

  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(58 46)">
      <circle cx="5" cy="5" r="5" fill="#4bb8ff"/>
      <text x="22" y="10" font-size="13" font-weight="700" letter-spacing="2.4" fill="#4bb8ff">PORTFOLIO / COMMAND CENTER</text>
      <g transform="translate(905 0)">
        <circle cx="5" cy="5" r="5" fill="#6ae4bd"/>
        <circle cx="5" cy="5" r="11" fill="none" stroke="#6ae4bd" stroke-opacity=".25"/>
        <text x="22" y="10" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6ae4bd">OPEN TO DATA ROLES</text>
      </g>
    </g>

    <g transform="translate(58 92)">
      <text y="48" font-size="58" font-weight="800" letter-spacing="-2.8" fill="#f8fbff">Leonardo Wendt</text>
      <text y="82" font-size="20" font-weight="600" letter-spacing=".4" fill="#9db2ca">DADOS · BI · ANALYTICS · FRONT-END · IA APLICADA</text>
      <text y="114" font-size="14" fill="#9db2ca">Visão de negócio + lógica + interface para transformar informação em decisões.</text>
    </g>

    <g transform="translate(58 236)" filter="url(#shadow)">
      <g>
        <rect width="246" height="92" rx="16" fill="#071426" fill-opacity=".82" stroke="#4bb8ff" stroke-opacity=".18"/>
        <text x="20" y="28" font-size="11" font-weight="700" letter-spacing="1.5" fill="#9db2ca">PUBLIC REPOSITORIES</text>
        <text x="20" y="69" font-size="32" font-weight="800" fill="#f8fbff">18+</text>
        <path d="M170 64l16-13 14 7 24-25" fill="none" stroke="url(#blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="224" cy="33" r="4" fill="#6ae4bd"/>
      </g>
      <g transform="translate(262)">
        <rect width="246" height="92" rx="16" fill="#071426" fill-opacity=".82" stroke="#4bb8ff" stroke-opacity=".18"/>
        <text x="20" y="28" font-size="11" font-weight="700" letter-spacing="1.5" fill="#9db2ca">PRO EXPERIENCE</text>
        <text x="20" y="69" font-size="32" font-weight="800" fill="#f8fbff">3</text>
        <text x="62" y="67" font-size="13" fill="#6ae4bd">áreas conectadas</text>
      </g>
      <g transform="translate(524)">
        <rect width="246" height="92" rx="16" fill="#071426" fill-opacity=".82" stroke="#4bb8ff" stroke-opacity=".18"/>
        <text x="20" y="28" font-size="11" font-weight="700" letter-spacing="1.5" fill="#9db2ca">REACT COMPONENTS</text>
        <text x="20" y="69" font-size="32" font-weight="800" fill="#f8fbff">15+</text>
        <text x="86" y="67" font-size="13" fill="#9db2ca">reutilizáveis</text>
      </g>
      <g transform="translate(786)">
        <rect width="246" height="92" rx="16" fill="#071426" fill-opacity=".82" stroke="#4bb8ff" stroke-opacity=".18"/>
        <text x="20" y="28" font-size="11" font-weight="700" letter-spacing="1.5" fill="#9db2ca">GRADUATION</text>
        <text x="20" y="69" font-size="32" font-weight="800" fill="#f8fbff">2028</text>
        <text x="110" y="67" font-size="13" fill="#9db2ca">Ciência da Computação</text>
      </g>
    </g>

    <g transform="translate(58 360)">
      <text y="12" font-size="11" font-weight="700" letter-spacing="1.6" fill="#9db2ca">EVOLUTION MAP</text>
      <path d="M0 55H1032" stroke="#dff3ff" stroke-opacity=".08"/>
      <path d="M18 52 C120 52,150 42,235 41 S365 35,450 31 S600 24,690 21 S840 10,1014 2" fill="none" stroke="url(#blue)" stroke-width="4" stroke-linecap="round"/>
      <path d="M18 52 C120 52,150 42,235 41 S365 35,450 31 S600 24,690 21 S840 10,1014 2 L1014 55 L18 55Z" fill="url(#blue)" opacity=".08"/>
      <g fill="#071426" stroke="#4bb8ff" stroke-width="3">
        <circle cx="18" cy="52" r="6"/><circle cx="235" cy="41" r="6"/><circle cx="450" cy="31" r="6"/><circle cx="690" cy="21" r="6"/>
      </g>
      <circle cx="1014" cy="2" r="7" fill="#6ae4bd"/>
      <g font-size="11" font-weight="600" fill="#9db2ca">
        <text x="0" y="78">NEGÓCIO</text><text x="212" y="78">FRONT-END</text><text x="428" y="78">PRODUTO</text><text x="674" y="78">BI</text><text x="958" y="78" fill="#6ae4bd">DADOS + IA</text>
      </g>
    </g>
  </g>
</svg>
